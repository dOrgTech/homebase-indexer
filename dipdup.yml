datasources:
  tzkt_mainnet:
    kind: tezos.tzkt
    url: https://api.mainnet.tzkt.io
  tzkt_ghostnet:
    kind: tezos.tzkt
    url: https://api.ghostnet.tzkt.io
templates:
  registry_dao:
    kind: tezos.tzkt.operations
    datasource: <datasource>
    types:
    - transaction
    - origination
    contracts:
    - <contract>
    handlers:
    - callback: on_origination
      pattern:
      - type: origination
        originated_contract: <contract>
    - callback: on_propose
      pattern:
      - destination: <contract>
        entrypoint: propose
    - callback: on_flush
      pattern:
      - destination: <contract>
        entrypoint: flush
    - callback: on_vote
      pattern:
      - destination: <contract>
        entrypoint: vote
    - callback: on_drop_proposal
      pattern:
      - destination: <contract>
        entrypoint: drop_proposal
    - callback: on_unstake_vote
      pattern:
      - destination: <contract>
        entrypoint: unstake_vote
    - callback: on_freeze
      pattern:
      - destination: <contract>
        entrypoint: freeze
    - callback: on_unfreeze
      pattern:
      - destination: <contract>
        entrypoint: unfreeze
