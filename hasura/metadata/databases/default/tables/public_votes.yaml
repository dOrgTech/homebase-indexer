table:
  name: votes
  schema: public
object_relationships:
- name: proposal
  using:
    foreign_key_constraint_on: proposal_id
- name: voter
  using:
    foreign_key_constraint_on: voter_id
- name: holder
  using:
    foreign_key_constraint_on: voter_id
select_permissions:
- role: indexer
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
