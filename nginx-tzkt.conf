# /etc/nginx/conf.d/tzkt-proxy.conf
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name tzkt-mainnet;

  # --- WebSocket hub: handle BOTH `/v1/events` and `/v1/events/...` ---
  # Exact match (no trailing slash): /v1/events?id=...
  location = /v1/events {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host api.tzkt.io;
    proxy_ssl_server_name on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    proxy_pass https://api.tzkt.io/v1/ws;
  }

  # Prefix match (with trailing slash): /v1/events/negotiate, /v1/events/...
  location ^~ /v1/events/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host api.tzkt.io;
    proxy_ssl_server_name on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    proxy_pass https://api.tzkt.io/v1/ws/;
  }

  # --- Pass-through for all other REST endpoints under /v1/ ---
  location /v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host api.tzkt.io;
    proxy_ssl_server_name on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_pass https://api.tzkt.io;
  }
}

server {
  listen 80;
  server_name tzkt-ghostnet;

  # --- WebSocket hub: handle BOTH `/v1/events` and `/v1/events/...` ---
  # Exact match (no trailing slash): /v1/events?id=...
  location = /v1/events {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host api.tzkt.io;
    proxy_ssl_server_name on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    proxy_pass https://api.ghostnet.tzkt.io/v1/ws;
  }

  # Prefix match (with trailing slash): /v1/events/negotiate, /v1/events/...
  location ^~ /v1/events/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host api.tzkt.io;
    proxy_ssl_server_name on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    proxy_pass https://api.ghostnet.tzkt.io/v1/ws/;
  }

  # --- Pass-through for all other REST endpoints under /v1/ ---
  location /v1/ {
    proxy_http_version 1.1;
    proxy_set_header Host api.tzkt.io;
    proxy_ssl_server_name on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_pass https://api.ghostnet.tzkt.io;
  }
}